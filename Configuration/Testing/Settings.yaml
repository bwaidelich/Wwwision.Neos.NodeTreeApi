# The functional tests work on a site and content repository of their own, with trees that don't depend on the ones
# shipped with the package
Neos:
  Neos:
    sites:
      'test-site':
        preset: 'default'
        contentRepository: 'nodetreetest'
        contentDimensions:
          defaultDimensionSpacePoint:
            language: 'en_US'
      'other-site':
        preset: 'default'
        contentRepository: 'nodetreetest'
        contentDimensions:
          defaultDimensionSpacePoint:
            language: 'en_US'
  ContentRepositoryRegistry:
    contentRepositories:
      'nodetreetest':
        preset: 'default'
        contentDimensions:
          language:
            values:
              'en_US':
                label: 'English (US)'
                specializations:
                  'en_UK':
                    label: 'English (UK)'
              'de':
                label: 'Deutsch'

Wwwision:
  Neos:
    NodeTreeApi:
      authenticationProviders:
        # the provider of FunctionalTestCase::authenticateRoles()
        'TestingProvider': true
      resolvers:
        'postingsByDate':
          className: 'Wwwision\Neos\NodeTreeApi\Resolver\DateGroupingResolver'
          options:
            groupedNodeType: 'Neos.Demo:Document.BlogPosting'
            property: 'datePublished'
      trees:
        'default': ~
        'documents':
          label: 'Neos.Neos:Main:document'
          icon: 'sitemap'
          baseNodeType: 'Neos.Neos:Document'
          childrenResolvers:
            'blog':
              nodeType: 'Neos.Demo:Document.Blog'
              resolver: 'postingsByDate'
        'withoutBlogs':
          label: 'Without blogs'
          baseNodeType: 'Neos.Neos:Document,!Neos.Demo:Document.Blog'
