<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Node Tree API Demo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        :root {
            --bg: #f6f7f9;
            --panel: #ffffff;
            --text: #1d2229;
            --muted: #6b7380;
            --border: #dde1e6;
            --accent: #00adee;
            --hover: #eef4f8;
            --selected: #d8effa;
            --danger: #c0392b;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1a1c20;
                --panel: #23262b;
                --text: #e4e6ea;
                --muted: #969ca6;
                --border: #3a3e45;
                --accent: #26b8f0;
                --hover: #2c3036;
                --selected: #16384a;
                --danger: #ef6b5c;
            }
        }
        * { box-sizing: border-box; }
        body { margin: 0; font: 14px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--text); }
        header { padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--panel); display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: end; }
        header h1 { font-size: 16px; margin: 0 16px 0 0; align-self: center; }
        label { display: flex; flex-direction: column; font-size: 12px; color: var(--muted); gap: 2px; }
        input, select, button { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 4px 6px; }
        button { cursor: pointer; }
        button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
        main { display: grid; grid-template-columns: minmax(280px, 420px) 1fr; gap: 16px; padding: 16px; }
        @media (max-width: 720px) { main { grid-template-columns: 1fr; } }
        .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; min-width: 0; }
        #tree { height: calc(100vh - 140px); overflow: auto; padding: 6px 0; }
        ul { list-style: none; margin: 0; padding: 0; }
        ul ul { padding-left: 16px; }
        .row { display: flex; align-items: center; gap: 6px; padding: 2px 8px; cursor: pointer; white-space: nowrap; border-radius: 3px; }
        .row:hover { background: var(--hover); }
        .row.selected { background: var(--selected); }
        .toggle { width: 14px; text-align: center; color: var(--muted); flex: none; }
        .icon { width: 16px; text-align: center; flex: none; color: var(--muted); }
        .label { overflow: hidden; text-overflow: ellipsis; }
        .virtual > .row .icon { color: var(--accent); }
        /* the appearances the API assigns to items */
        .row.muted .label, .row.muted .icon { opacity: .5; }
        .row.strikethrough .label { text-decoration: line-through; }
        .row.italic .label { font-style: italic; }
        .badge { font-size: 11px; color: var(--muted); }
        .more { padding: 2px 8px 2px 28px; color: var(--muted); font-size: 12px; }
        .more button { font-size: 12px; padding: 1px 6px; }
        .error { color: var(--danger); padding: 8px 12px; white-space: pre-wrap; }
        #details { padding: 12px; overflow: auto; }
        #details h2 { font-size: 14px; margin: 0 0 8px; }
        pre { margin: 0; font-size: 12px; white-space: pre-wrap; word-break: break-all; }
        #log { margin-top: 16px; font-size: 12px; color: var(--muted); }
        /* drag and drop */
        .row[draggable="true"] { cursor: grab; }
        .row.dragging { opacity: .4; }
        .row.drop-into { outline: 2px solid var(--accent); outline-offset: -2px; }
        .row.drop-before { box-shadow: inset 0 2px 0 var(--accent); }
        .row.drop-after { box-shadow: inset 0 -2px 0 var(--accent); }
        #message { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); max-width: calc(100vw - 32px); padding: 8px 14px; border-radius: 4px; background: var(--danger); color: #fff; }
    </style>
</head>
<body>
<header>
    <h1>Node Tree API</h1>
    <label>Tree <select id="treeId"></select></label>
    <label>Workspace <input id="workspace" placeholder="personal workspace" size="16"></label>
    <label>Dimensions <input id="dimensions" placeholder="default of the site" size="20"></label>
    <label>Limit <input id="limit" type="number" value="20" min="1" max="200" style="width: 5em"></label>
    <label>Expand to <input id="expandTo" placeholder="item id" size="24"></label>
    <button class="primary" id="load">Load</button>
    <a href="/neos/node-tree-api/docs" target="_blank" style="align-self: center; color: var(--accent)">API docs</a>
</header>
<main>
    <div class="panel" id="tree"></div>
    <div class="panel" id="details">
        <h2>Selected item</h2>
        <pre id="selected">Click an item</pre>
        <h2 style="margin-top: 16px">Context</h2>
        <pre id="context">–</pre>
        <div id="log"></div>
    </div>
</main>
<div id="message" hidden></div>
<script>
    const apiBase = new URL('/neos/node-tree-api/', window.location.href);
    const $ = (id) => document.getElementById(id);
    const settings = () => ({
        tree: $('treeId').value,
        workspace: $('workspace').value,
        dimensions: $('dimensions').value,
        limit: $('limit').value,
    });

    // the context the tree was loaded in – the following pages are requested in the same one, since cursors are
    // bound to it (and the defaults could change in the meantime)
    let context = null;

    let requestCount = 0;

    async function api(path, params = {}, {method = 'GET', body = null} = {}) {
        const url = new URL(path, apiBase);
        for (const [key, value] of Object.entries(params)) {
            if (value !== null && value !== undefined && value !== '') {
                url.searchParams.set(key, value);
            }
        }
        const started = performance.now();
        const headers = {Accept: 'application/json'};
        if (body !== null) {
            headers['Content-Type'] = 'application/json';
        }
        const response = await fetch(url, {method, credentials: 'same-origin', headers, body: body !== null ? JSON.stringify(body) : null});
        const responseBody = await response.json();
        $('log').textContent = `Request #${++requestCount}: ${method} ${decodeURIComponent(url.pathname + url.search)} → ${response.status} in ${Math.round(performance.now() - started)} ms`;
        if (!response.ok) {
            const error = new Error(`${responseBody.status} ${responseBody.title}: ${responseBody.detail ?? ''}${responseBody.issues?.length ? '\n' + JSON.stringify(responseBody.issues, null, 2) : ''}`);
            error.detail = responseBody.detail;
            throw error;
        }
        return responseBody;
    }

    // the workspace and dimensions of all requests after the first one
    function contextParams() {
        const s = settings();
        return {
            workspace: context?.workspace ?? s.workspace,
            dimensions: context ? JSON.stringify(context.dimensions) : s.dimensions,
        };
    }

    function treePath(suffix) {
        return `trees/${encodeURIComponent(settings().tree)}/${suffix}`;
    }

    function listItems(extraParams) {
        return api(treePath('items'), {...contextParams(), limit: settings().limit, ...extraParams});
    }

    function iconClass(icon) {
        if (!icon) {
            return 'fa-regular fa-circle';
        }
        if (icon.includes('fa-')) {
            return icon;
        }
        return 'fa-solid fa-' + icon.replace(/^icon-/, '');
    }

    function showMessage(text) {
        const message = $('message');
        message.textContent = text;
        message.hidden = false;
        clearTimeout(showMessage.timeout);
        showMessage.timeout = setTimeout(() => message.hidden = true, 5000);
    }

    // Renders (a page of) a level into the <ul> of its parent (or the root). A page that is appended brings the
    // sentinel for the next page, a page that is prepended the button for the previous one
    function renderLevel(container, level, levelsByParentId, prepend = false) {
        const list = container.querySelector(':scope > ul') ?? container.appendChild(document.createElement('ul'));
        const isFirstPage = list.children.length === 0;
        const fragment = document.createDocumentFragment();
        for (const item of level.items) {
            fragment.appendChild(renderItem(item, levelsByParentId));
        }
        if (prepend) {
            list.querySelector(':scope > .more.previous')?.remove();
            list.prepend(fragment);
        } else {
            list.querySelector(':scope > .more.next')?.remove();
            list.appendChild(fragment);
        }
        if (level.previousCursor && (prepend || isFirstPage)) {
            const more = document.createElement('li');
            more.className = 'more previous';
            const button = document.createElement('button');
            button.textContent = 'Load previous';
            button.onclick = () => loadPage(container, level.parentId, level.previousCursor, true);
            more.appendChild(button);
            list.prepend(more);
        }
        if (level.nextCursor && (!prepend || isFirstPage)) {
            const more = document.createElement('li');
            more.className = 'more next';
            more.textContent = 'Loading more…';
            list.appendChild(more);
            // endless scrolling: load the next page as soon as its sentinel becomes visible
            const observer = new IntersectionObserver((entries) => {
                if (entries.some((entry) => entry.isIntersecting)) {
                    observer.disconnect();
                    loadPage(container, level.parentId, level.nextCursor, false);
                }
            }, {root: $('tree')});
            observer.observe(more);
        }
    }

    async function loadPage(container, parentId, cursor, prepend) {
        try {
            const result = await listItems({parent: parentId, cursor});
            renderLevel(container, result.levels[0], {}, prepend);
        } catch (error) {
            showError(container, error);
        }
    }

    // An item is an <li> with its data in "item", its row, and a <ul> with its children once they are loaded
    function renderItem(item, levelsByParentId) {
        const element = document.createElement('li');
        element.dataset.id = item.id;
        element.classList.toggle('virtual', item.node === null);
        element.appendChild(document.createElement('div'));
        renderRow(element, item);

        // levels that came along with "expandTo"
        const level = levelsByParentId[item.id];
        if (level) {
            renderLevel(element, level, levelsByParentId);
            setExpanded(element, true);
        }
        return element;
    }

    function renderRow(element, item) {
        element.item = item;
        const row = document.createElement('div');
        row.className = 'row';
        row.classList.add(...item.appearance);
        row.title = item.tooltip ?? '';
        row.draggable = item.draggable;
        const toggle = document.createElement('span');
        toggle.className = 'toggle';
        const icon = document.createElement('i');
        icon.className = 'icon ' + iconClass(item.icon);
        const label = document.createElement('span');
        label.className = 'label';
        label.textContent = item.label;
        row.append(toggle, icon, label);
        for (const {icon, tooltip} of item.badges) {
            const badge = document.createElement('i');
            badge.className = 'badge ' + iconClass(icon);
            badge.title = tooltip;
            row.appendChild(badge);
        }
        toggle.onclick = (event) => {
            event.stopPropagation();
            if (isExpanded(element)) {
                setExpanded(element, false);
            } else {
                expand(element);
            }
        };
        row.onclick = () => select(element);
        row.ondragstart = (event) => dragStart(event, element);
        row.ondragend = dragEnd;
        row.ondragover = (event) => dragOver(event, element);
        row.ondragleave = () => row.classList.remove('drop-into', 'drop-before', 'drop-after');
        row.ondrop = (event) => drop(event, element);
        element.querySelector(':scope > .row, :scope > div').replaceWith(row);
        setExpanded(element, isExpanded(element));
    }

    function isExpanded(element) {
        const children = element.querySelector(':scope > ul');
        return children !== null && !children.hidden;
    }

    function setExpanded(element, expanded) {
        const children = element.querySelector(':scope > ul');
        if (children) {
            children.hidden = !expanded;
        }
        element.querySelector(':scope > .row > .toggle').innerHTML = element.item.hasChildren ? `<i class="fa-solid fa-caret-${expanded ? 'down' : 'right'}"></i>` : '';
    }

    async function expand(element) {
        if (!element.item.hasChildren) {
            return;
        }
        const loaded = element.querySelector(':scope > ul') !== null;
        if (!loaded) {
            element.appendChild(document.createElement('ul'));
        }
        setExpanded(element, true);
        if (!loaded) {
            await loadPage(element, element.item.id, null, false);
        }
    }

    function select(element) {
        document.querySelectorAll('.row.selected').forEach((selected) => selected.classList.remove('selected'));
        element.querySelector(':scope > .row').classList.add('selected');
        $('selected').textContent = JSON.stringify(element.item, null, 2);
    }

    // the item of the level an item is part of – null for the root level
    function levelParentOf(element) {
        const parent = element.parentElement.parentElement;
        return parent.item ? parent : null;
    }

    function findItem(id) {
        return $('tree').querySelector(`li[data-id="${CSS.escape(id)}"]`);
    }

    /*
     * Drag and drop: when dragging starts, the drop keys of the dragged item are requested – after that, every drop
     * target is decided locally, without further requests
     */
    let dragged = null;

    function dragStart(event, element) {
        event.dataTransfer.effectAllowed = 'move';
        event.dataTransfer.setData('text/plain', element.item.label);
        element.querySelector(':scope > .row').classList.add('dragging');
        dragged = {element, dropKeys: null, hovered: null, expandTimeout: null};
        const current = dragged;
        api(treePath(`items/${encodeURIComponent(element.item.id)}/drop-keys`), contextParams())
            .then((result) => current.dropKeys = new Set(result.dropKeys))
            .catch((error) => showMessage(error.message));
    }

    function dragEnd() {
        if (dragged) {
            clearTimeout(dragged.expandTimeout);
            dragged.element.querySelector(':scope > .row')?.classList.remove('dragging');
        }
        document.querySelectorAll('.drop-into, .drop-before, .drop-after').forEach((row) => row.classList.remove('drop-into', 'drop-before', 'drop-after'));
        dragged = null;
    }

    // "before" in the upper quarter of a row, "after" in the lower quarter, "into" in between
    function positionAt(event, row) {
        const {top, height} = row.getBoundingClientRect();
        const offset = (event.clientY - top) / height;
        return offset < .25 ? 'before' : offset > .75 ? 'after' : 'into';
    }

    function accepts(target, position) {
        if (!dragged?.dropKeys || dragged.element.contains(target)) {
            // not loaded yet, or the dragged item itself or one of its descendants
            return false;
        }
        if (position === 'into') {
            return dragged.dropKeys.has(target.item.dropKey);
        }
        const levelParent = levelParentOf(target);
        return target.item.sortable && levelParent !== null && dragged.dropKeys.has(levelParent.item.dropKey);
    }

    function dragOver(event, element) {
        if (!dragged) {
            return;
        }
        const row = element.querySelector(':scope > .row');
        if (dragged.hovered !== element) {
            // expand collapsed items after hovering them for a moment
            clearTimeout(dragged.expandTimeout);
            dragged.hovered = element;
            if (element.item.hasChildren && !isExpanded(element)) {
                dragged.expandTimeout = setTimeout(() => expand(element), 700);
            }
        }
        const position = positionAt(event, row);
        row.classList.remove('drop-into', 'drop-before', 'drop-after');
        if (accepts(element, position)) {
            event.preventDefault();
            event.dataTransfer.dropEffect = 'move';
            row.classList.add('drop-' + position);
        }
    }

    async function drop(event, target) {
        event.preventDefault();
        const position = positionAt(event, target.querySelector(':scope > .row'));
        const accepted = accepts(target, position);
        const element = dragged?.element;
        dragEnd();
        if (!accepted || !element) {
            return;
        }
        try {
            const result = await api(
                treePath(`items/${encodeURIComponent(element.item.id)}/move`),
                {...contextParams(), limit: settings().limit},
                {method: 'POST', body: {target: target.item.id, position}},
            );
            removeItem(element);
            if (result.previousParent) {
                const previousParent = findItem(result.previousParent.id);
                if (previousParent) {
                    renderRow(previousParent, result.previousParent);
                }
            }
            mergeLevels(result.levels, element.item.id);
        } catch (error) {
            showMessage(error.detail ?? error.message);
        }
    }

    // removes an item from its level – if that is empty then, its parent has no children anymore
    function removeItem(element) {
        const list = element.parentElement;
        element.remove();
        if (list.querySelector(':scope > li[data-id]') === null && list.parentElement.item) {
            const parent = list.parentElement;
            list.remove();
            renderRow(parent, {...parent.item, hasChildren: false});
        }
    }

    // Merges the levels down to a moved item: the level that contains it is replaced, as well as levels above it that
    // don't contain the next one (e.g. new virtual items). Levels that already contain the next one are kept – with
    // the pages that were loaded before
    function mergeLevels(levels, movedItemId) {
        for (let i = 1; i < levels.length; i++) {
            const container = findItem(levels[i].parentId);
            if (!container) {
                // the parent is on a page that is not loaded – start over
                $('expandTo').value = movedItemId;
                load();
                return;
            }
            const list = container.querySelector(':scope > ul');
            const next = levels[i + 1];
            if (!list || !next || !list.querySelector(`:scope > li[data-id="${CSS.escape(next.parentId)}"]`)) {
                list?.remove();
                renderLevel(container, levels[i], {});
            }
            renderRow(container, {...container.item, hasChildren: true});
            setExpanded(container, true);
        }
        const moved = findItem(movedItemId);
        if (moved) {
            select(moved);
            moved.scrollIntoView({block: 'nearest'});
        }
    }

    function showError(container, error) {
        const element = document.createElement('div');
        element.className = 'error';
        element.textContent = error.message;
        container.appendChild(element);
    }

    async function load() {
        const tree = $('tree');
        tree.replaceChildren();
        context = null;
        try {
            const expandTo = $('expandTo').value.trim();
            const result = await listItems({expandTo});
            context = result.context;
            $('context').textContent = JSON.stringify(context, null, 2);
            const levelsByParentId = Object.fromEntries(result.levels.filter((level) => level.parentId !== null).map((level) => [level.parentId, level]));
            renderLevel(tree, result.levels[0], levelsByParentId);
            if (expandTo) {
                const target = findItem(expandTo);
                if (target) {
                    select(target);
                    target.scrollIntoView({block: 'center'});
                }
            }
        } catch (error) {
            showError(tree, error);
        }
    }

    async function init() {
        try {
            const result = await api('trees');
            for (const tree of result) {
                const option = document.createElement('option');
                option.value = tree.id;
                option.textContent = tree.label;
                $('treeId').appendChild(option);
            }
            await load();
        } catch (error) {
            showError($('tree'), new Error(error.message + '\n\nYou need to be logged in to the Neos backend in this browser.'));
        }
    }

    $('load').onclick = load;
    $('treeId').onchange = load;
    init();
</script>
</body>
</html>
